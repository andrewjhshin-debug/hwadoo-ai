<head>

<title>화두</title>
<style>
  html,body{margin:0;height:100%;background:#eceef1;color:#1a1a1c;

</style>

  <div class="wrap">
    <h1>화 두</h1>
    <p>도량에 닿지 못했어요<span class="dot">.</span><br>인터넷 연결을 확인하고 다시 열어 주세요.</p>
  </div>
</body>
</html>
