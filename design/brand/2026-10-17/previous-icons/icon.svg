<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 형: 「로고도 바꿔야지 심플하게 가자. 연분홍 민트 뭐 이런 느낌」
       먹빛 바탕에 금빛 법륜은 리뉴얼과 아무 상관이 없는 옛 얼굴이었다.
       머리의 연꽃(.hip-home)과 **같은 실루엣**을 쓴다 — 가운데 꽃잎 하나,
       옆으로 잎 둘. 탭에서는 16px 이라 획을 굵게 잡는다.
       흰 획을 진한 바탕에 얹어 봤더니 16px 에서 뭉갰다. 연분홍·연민트를
       바탕에 깔고 획을 **분홍으로 세우는** 쪽이 또렷하다 — 머리의 연꽃도
       흰 종이 위 분홍이니 얼굴이 같아진다. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBD3E1"/>
      <stop offset="1" stop-color="#C2E8DC"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#g)"/>
  <g fill="none" stroke="#E1699A" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 13.9c4.5 6.4 6.4 11.7 6.4 16.8 0 5.1-2.9 9.9-6.4 13.1-3.5-3.2-6.4-8-6.4-13.1 0-5.1 1.9-10.4 6.4-16.8z"/>
    <path d="M32 43.8c-5.1-4.3-12.3-6.1-19.7-5.9.8 6.9 6.4 12.3 13.3 13.3 2.4.3 4.5 0 6.4-.8"/>
    <path d="M32 43.8c5.1-4.3 12.3-6.1 19.7-5.9-.8 6.9-6.4 12.3-13.3 13.3-2.4.3-4.5 0-6.4-.8"/>
  </g>
</svg>
