<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>키캡 적용 비교</title><style>body{margin:0;background:radial-gradient(ellipse at 0 0,#fbe5ee,transparent 65%),radial-gradient(ellipse at 100% 20%,#dff3ec,transparent 60%),#faf8f6;font-family:system-ui;color:#86786e}main{max-width:960px;margin:30px auto;padding:20px}h1{font-size:17px;font-weight:400;text-align:center;margin-bottom:35px}section{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}figure{margin:0;text-align:center}.hip-keycap{width:100%;aspect-ratio:5/7;border:0;padding:0;background:none;touch-action:manipulation}.hip-keycap-stack{position:relative;display:block;width:100%;height:100%}.hip-keycap-stack img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.hip-keycap-back{z-index:0}.hip-keycap-buddha{z-index:1}.hip-keycap-cup{z-index:2}figcaption{margin:14px 0;font-size:13px}.hip-keycap .hip-keycap-stack.keycap-v3 {aspect-ratio:5 / 7;filter:none;isolation:isolate}
.hip-keycap .keycap-v3 .hip-keycap-back,
.hip-keycap .keycap-v3 .hip-keycap-cup {transform:none!important;filter:none;pointer-events:none}
.hip-keycap .keycap-v3 .hip-keycap-buddha {transform:translateY(0);transform-origin:50% 100%;filter:brightness(1.18) saturate(1.1) contrast(.96);pointer-events:none;transition:transform .3s cubic-bezier(.2,1.45,.3,1)}
.hip-keycap.on .keycap-v3 .hip-keycap-buddha {transform:translateY(var(--keycap-dip,8%));transition:transform .07s ease-out}
@media(prefers-reduced-motion:reduce){.hip-keycap .keycap-v3 .hip-keycap-buddha {transition:none}}
@media(max-width:500px){main{margin:15px auto;padding:16px}section{gap:12px}h1{margin-bottom:20px}}</style><main><h1>키캡</h1><section><figure><button class="hip-keycap" data-keycap-skin="dongja" onpointerdown="this.classList.add('on')" onpointerup="this.classList.remove('on')" onpointerleave="this.classList.remove('on')" aria-label="동자 눌림 확인"><span class="hip-keycap-stack keycap-v3" style="--keycap-dip:8%"><img class="hip-keycap-back" src="/obj/keycaps-v3/dongja-back.webp"><img class="hip-keycap-buddha" src="/obj/keycaps-v3/dongja-body.webp"><img class="hip-keycap-cup" src="/obj/keycaps-v3/dongja-front.webp"></span></button><figcaption>동자</figcaption></figure><figure><button class="hip-keycap" data-keycap-skin="podae" onpointerdown="this.classList.add('on')" onpointerup="this.classList.remove('on')" onpointerleave="this.classList.remove('on')" aria-label="포대 눌림 확인"><span class="hip-keycap-stack keycap-v3" style="--keycap-dip:8%"><img class="hip-keycap-back" src="/obj/keycaps-v3/podae-back.webp"><img class="hip-keycap-buddha" src="/obj/keycaps-v3/podae-body.webp"><img class="hip-keycap-cup" src="/obj/keycaps-v3/podae-front.webp"></span></button><figcaption>포대</figcaption></figure><figure><button class="hip-keycap" data-keycap-skin="mireuk" onpointerdown="this.classList.add('on')" onpointerup="this.classList.remove('on')" onpointerleave="this.classList.remove('on')" aria-label="미륵 눌림 확인"><span class="hip-keycap-stack keycap-v3" style="--keycap-dip:8%"><img class="hip-keycap-back" src="/obj/keycaps-v3/mireuk-back.webp"><img class="hip-keycap-buddha" src="/obj/keycaps-v3/mireuk-body.webp"><img class="hip-keycap-cup" src="/obj/keycaps-v3/mireuk-front.webp"></span></button><figcaption>미륵</figcaption></figure></section></main>
