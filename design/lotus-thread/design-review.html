<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>화두 디자인 확인</title><style>.inyeon-silk-card {width:100%;overflow:hidden;border:1px solid #ffffff17;border-radius:20px;padding:18px 20px 15px;background:linear-gradient(160deg,#211d21,#161b23);color:#e8dfd6}
.inyeon-silk-day {border-color:#b8a8a52b;background:radial-gradient(ellipse at 12% 100%,#c3d6e51a,transparent 65%),radial-gradient(ellipse at 88% 100%,#efd0d72b,transparent 65%),#fffcf8;color:#736760}
.silk-knot {display:block;width:100%;height:auto;overflow:visible}
.inyeon-silk-names {display:flex;justify-content:space-between;gap:16px;font:300 13px/1.5 var(--font-serif,serif)}
.inyeon-silk-names>span {display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inyeon-silk-names small {font:10px/1.2 sans-serif;letter-spacing:.12em}
.silk-match-badge {display:inline-flex;vertical-align:middle;align-items:center;justify-content:center;width:30px;height:22px;flex-shrink:0;margin-left:5px;border-radius:12px;background:#f5eee7}
.silk-knot-small {width:27px;height:20px;display:block}

.hip-daybar .hip-daybar-lotus .merit-lotus { width:36px; height:36px; overflow:visible; }
.hip-daybar .hip-daybar-lotus,
.hip-daybar[data-full="1"] .hip-daybar-lotus { filter:none!important; box-shadow:none!important; animation:none!important; }
.merit-lotus { overflow:visible; }
.merit-lotus .merit-lotus-petal { transform-box:view-box; transform-origin:22px 33px; transition:transform .65s cubic-bezier(.2,.8,.3,1); }
@media(prefers-reduced-motion:reduce) { .merit-lotus .merit-lotus-petal { transition:none; } }
